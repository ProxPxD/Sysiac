- name: Install Podman and Related Tools
  import_tasks: ../tasks/yay.yml
  vars:
    package_s: [podman, docker-compose]

- name: Set Podman Envs
  import_tasks: ../tasks/add-fish-conf.yml
  vars:
    file_s: podman
    content: |
      set -gx CONTAINERS_COLOR 1
      set -gx DOCKER_HOST unix://$XDG_RUNTIME_DIR/podman/podman.sock

- name: 'Prepare Containers Dir'
  block:
  - name: Create Containers Dir
    file:
      path: '{{podman_containers_path}}'
      state: directory
      mode: '0755'

  - name: Conf registries.conf
    copy:
      dest: '{{podman_containers_path}}/registries.conf'
      mode: '0644'
      content: unqualified-search-registries = ["docker.io"]

  - name: Conf containers.conf
    copy:
      dest: '{{podman_containers_path}}/containers.conf'
      mode: '0644'
      content: |
        [engine]
        compose_warning_logs=false

- name: Prepare Podman Dir
  block:
    - name: Create Podman Dir
      file:
        path: '{{podman_volume_path}}'
        state: directory
        owner: '{{linux_user}}'
        group: '{{linux_user}}'
        recurse: true
      become: true

    - name: Check Podman Namespace Ownership
      stat:
        path: '{{podman_volume_path}}/.namespace-owned'
      register: podman_path_stat

    - name: Set Podman namespace ownership
      block:
      - name: Podman Unshare
        command:
          cmd: 'podman unshare chown -R 0:0 {{podman_volume_path}}'

      - name: Create Namespace Ownership Marker
        file:
          path: '{{podman_volume_path}}/.namespace-owned'
          state: touch
      when: not podman_path_stat.stat.exists
