containers_path: '{{conf_path}}/containers'

base_paths:
  containers: '{{conf_path}}/containers'
  mounts: '/opt/podman'
derivated_paths:
  containers_systemd: '{{containers_path}}/systemd'
  vaultwarden_mount: '{{base_paths.mounts}}/vaultwarden'
all_paths: '{{base_paths | combine(derivated_paths)}}'

############################
# Central Podman Structure #
############################
podman:
  conf:
    envs:
      color: 1
    registries:
      unqualifieds: ['docker.io']
    compose:
      warning_logs: false
  paths: '{{all_paths}}'
  apps:
    vaultwarden:
      networks:
        common:
          external: true
      services:
        vaultwarden:
          image: vaultwarden/server:latest
          container_name: vaultwarden
          ports: [127.0.0.1:7000:80]
          restart: unless-stopped
          volumes:
            - '{{all_paths.vaultwarden_mount}}/data/:/data'
            - '{{all_paths.vaultwarden_mount}}/ssl:/ssl:Z'
          environment:
            DOMAIN: 'https://proxpxd.vaultwarden.pl'
            ROCKET_TLS: '{certs="/ssl/localhost.pem",key="/ssl/localhost-key.pem"}'
          labels:
            app: vaultwarden
            role: app
