- name: Configure Konsole profile
  template:
    src: profile.j2
    dest: '{{user_dir}}/.local/share/konsole/{{username}}.profile'
    mode: '0644'
  tags:
    - konsole
    - profile

- name: Set default Konsole profile
  ini_file:
    path: '{{user_dir}}/.config/konsolerc'
    section: Desktop Entry
    option: DefaultProfile
    value: '{{username}}.profile'
  tags:
    - konsole
    - profile
