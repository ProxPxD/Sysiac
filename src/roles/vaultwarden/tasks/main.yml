- name: Create Podman Mounts
  file:
    path: '{{podman.paths.vaultwarden_mount}}/{{item}}/'
    state: directory
    mode: '0755'
  loop:
    - data
    - ssl

- name: Ensure mkcert local CA
  block:
    - name: Get mkcert CA path
      command:
        cmd: mkcert -CAROOT
      register: mkcert_caroot
      changed_when: false

    - name: Install mkcert local CA
      command:
        cmd: mkcert -install
      when: not (mkcert_caroot.stdout | trim is directory)

- name: Generate Vaultwarden certificate
  command:
    chdir: '{{podman.paths.vaultwarden_mount}}/ssl'
    cmd: >
      mkcert
        -cert-file localhost.pem
        -key-file localhost-key.pem
        localhost 127.0.0.1 ::1
    creates: '{{podman.paths.vaultwarden_mount}}/ssl/localhost.pem'

- name: Run Container
  include_tasks: ../tasks/establish-podman-app.yml
  vars:
    app_name: vaultwarden
